spring.application.name=identity-hub

spring.datasource.url=${IDENTITY_HUB_DB_URL:jdbc:postgresql://localhost:5432/identity_hub}
spring.datasource.username=${IDENTITY_HUB_DB_USERNAME:identity_hub}
spring.datasource.password=${IDENTITY_HUB_DB_PASSWORD:identity_hub_dev}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

server.forward-headers-strategy=${IDENTITY_HUB_FORWARD_HEADERS_STRATEGY:framework}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${IDENTITY_HUB_COOKIE_SECURE:false}
server.servlet.session.timeout=30m

identity-hub.issuer=${IDENTITY_HUB_ISSUER:http://localhost:8080}
identity-hub.ui-base-url=${IDENTITY_HUB_UI_BASE_URL:http://localhost:4200}
identity-hub.interaction-ttl=5m
identity-hub.signing-key.source=${IDENTITY_HUB_SIGNING_KEY_SOURCE:generated}
identity-hub.signing-key.key-id=${IDENTITY_HUB_SIGNING_KEY_ID:}
identity-hub.signing-key.private-key-location=${IDENTITY_HUB_SIGNING_PRIVATE_KEY_LOCATION:}
identity-hub.signing-key.public-key-location=${IDENTITY_HUB_SIGNING_PUBLIC_KEY_LOCATION:}
identity-hub.signing-key.next-key-id=${IDENTITY_HUB_SIGNING_NEXT_KEY_ID:}
identity-hub.signing-key.next-private-key-location=${IDENTITY_HUB_SIGNING_NEXT_PRIVATE_KEY_LOCATION:}
identity-hub.signing-key.next-public-key-location=${IDENTITY_HUB_SIGNING_NEXT_PUBLIC_KEY_LOCATION:}
identity-hub.signing-key.activation-at=${IDENTITY_HUB_SIGNING_ACTIVATION_AT:}
identity-hub.signing-key.previous-key-retention=${IDENTITY_HUB_SIGNING_PREVIOUS_KEY_RETENTION:10m}
identity-hub.registration.verification-ttl=${IDENTITY_HUB_EMAIL_VERIFICATION_TTL:30m}
identity-hub.registration.mail-from=${IDENTITY_HUB_MAIL_FROM:no-reply@identityhub.local}
identity-hub.password-recovery.token-ttl=${IDENTITY_HUB_PASSWORD_RECOVERY_TTL:15m}
identity-hub.login-protection.failure-threshold=${IDENTITY_HUB_LOGIN_FAILURE_THRESHOLD:5}
identity-hub.login-protection.initial-lock-duration=${IDENTITY_HUB_LOGIN_INITIAL_LOCK_DURATION:1m}
identity-hub.login-protection.maximum-lock-duration=${IDENTITY_HUB_LOGIN_MAXIMUM_LOCK_DURATION:15m}
identity-hub.abuse-protection.window=${IDENTITY_HUB_RATE_LIMIT_WINDOW:1m}
identity-hub.abuse-protection.subject-limit=${IDENTITY_HUB_RATE_LIMIT_SUBJECT:10}
identity-hub.abuse-protection.origin-limit=${IDENTITY_HUB_RATE_LIMIT_ORIGIN:60}
identity-hub.abuse-protection.combination-limit=${IDENTITY_HUB_RATE_LIMIT_COMBINATION:8}
identity-hub.abuse-protection.maximum-buckets=${IDENTITY_HUB_RATE_LIMIT_MAXIMUM_BUCKETS:100000}
identity-hub.audit-retention.enabled=${IDENTITY_HUB_AUDIT_RETENTION_ENABLED:false}
identity-hub.audit-retention.retention=${IDENTITY_HUB_AUDIT_RETENTION_PERIOD:365d}
identity-hub.audit-retention.batch-size=${IDENTITY_HUB_AUDIT_RETENTION_BATCH_SIZE:1000}
identity-hub.audit-retention.initial-delay=${IDENTITY_HUB_AUDIT_RETENTION_INITIAL_DELAY:1m}
identity-hub.audit-retention.interval=${IDENTITY_HUB_AUDIT_RETENTION_INTERVAL:1h}
identity-hub.observability.metrics.token=${IDENTITY_HUB_METRICS_TOKEN:}
identity-hub.observability.metrics.token-location=${IDENTITY_HUB_METRICS_TOKEN_LOCATION:}
identity-hub.mfa.encryption-key=${IDENTITY_HUB_MFA_ENCRYPTION_KEY}
identity-hub.bootstrap.enabled=${IDENTITY_HUB_BOOTSTRAP_ENABLED:false}
identity-hub.bootstrap.user-email=${IDENTITY_HUB_DEMO_EMAIL:admin@identityhub.local}
identity-hub.bootstrap.user-password=${IDENTITY_HUB_DEMO_PASSWORD:ChangeMeSecureAccess123!}
identity-hub.bootstrap.user-name=${IDENTITY_HUB_DEMO_NAME:Administrador Identity Hub}
identity-hub.bootstrap.client-id=${IDENTITY_HUB_DEMO_CLIENT_ID:identity-hub-demo}
identity-hub.bootstrap.client-name=${IDENTITY_HUB_DEMO_CLIENT_NAME:Cliente demonstrativo Identity Hub}
identity-hub.bootstrap.redirect-uri=${IDENTITY_HUB_DEMO_REDIRECT_URI:http://localhost:4200/demo/callback}
identity-hub.bootstrap.post-logout-redirect-uri=${IDENTITY_HUB_DEMO_POST_LOGOUT_REDIRECT_URI:http://localhost:4200/demo/logout}
identity-hub.bootstrap.tenant-slug=${IDENTITY_HUB_DEMO_TENANT_SLUG:identity-hub-demo}
identity-hub.bootstrap.tenant-name=${IDENTITY_HUB_DEMO_TENANT_NAME:Organização demonstrativa}

spring.mail.host=${IDENTITY_HUB_MAIL_HOST:localhost}
spring.mail.port=${IDENTITY_HUB_MAIL_PORT:1025}
spring.mail.username=${IDENTITY_HUB_MAIL_USERNAME:}
spring.mail.password=${IDENTITY_HUB_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${IDENTITY_HUB_MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${IDENTITY_HUB_MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true
management.endpoint.health.probes.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.identity-hub.session.refresh.duration=true
