spring.datasource.url=jdbc:h2:mem:identityhub;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.autoconfigure.exclude=org.springframework.boot.session.data.redis.autoconfigure.SessionDataRedisAutoConfiguration
identity-hub.abuse-protection.store=memory
management.health.redis.enabled=false
management.endpoint.health.group.readiness.include=readinessState,db
identity-hub.issuer=http://localhost
identity-hub.ui-base-url=http://localhost:4200
identity-hub.bootstrap.enabled=true
identity-hub.bootstrap.user-password=TestSecureAccessPhrase123!
identity-hub.mfa.encryption-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
identity-hub.webauthn.rp-id=localhost
identity-hub.webauthn.rp-name=Identity Hub Test
identity-hub.webauthn.allowed-origins=http://localhost,http://localhost:4200
identity-hub.observability.metrics.token=test-metrics-token-0123456789abcdef
management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true
