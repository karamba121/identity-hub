map $http_x_forwarded_proto $identity_hub_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

resolver 127.0.0.11 valid=5s ipv6=off;

upstream identity_hub_backend {
    zone identity_hub_backend 64k;
    server backend:8080 resolve;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /api/ {
        proxy_pass http://identity_hub_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $identity_hub_forwarded_proto;
    }

    location ^~ /oauth2/ {
        proxy_pass http://identity_hub_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $identity_hub_forwarded_proto;
    }

    location ^~ /connect/ {
        proxy_pass http://identity_hub_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $identity_hub_forwarded_proto;
    }

    location = /userinfo {
        proxy_pass http://identity_hub_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $identity_hub_forwarded_proto;
    }

    location ^~ /.well-known/ {
        proxy_pass http://identity_hub_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $identity_hub_forwarded_proto;
    }
}
