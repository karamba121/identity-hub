<div class="relative h-[calc(100vh-77px)] px-4 xl:flex xl:px-0">
  <div class="flex flex-1 flex-col xl:flex-row">
    <!-- ===== Mobile/Tablet Trigger Bar (hidden on xl+) ===== -->
    <div
      class="mt-4 flex items-center justify-between rounded-2xl border border-gray-200 bg-white p-3 pl-5 xl:hidden dark:border-gray-800 dark:bg-white/3"
    >
      <span class="text-lg font-medium text-gray-800 dark:text-white/90">
        {{ getTabLabel(activeTab) }}
      </span>
      <button
        (click)="isSidebarOpen = true"
        class="flex size-10 items-center justify-center rounded-lg border border-gray-300 text-gray-800 dark:border-gray-800 dark:text-white/90 cursor-pointer"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="M4 6L20 6M4 18L20 18M4 12L20 12"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </div>

    <!-- ===== Dynamic Tab Menu Component ===== -->
    <app-ai-settings-tab-menu
      [(activeTab)]="activeTab"
      [(isSidebarOpen)]="isSidebarOpen"
    ></app-ai-settings-tab-menu>

    <!-- ===== Tab Panels Container ===== -->
    <div class="flex-1 overflow-y-auto xl:py-4">
      <!-- Account Panel -->
      <app-ai-settings-account
        [activeTab]="activeTab"
      ></app-ai-settings-account>

      <!-- General Panel -->
      <app-ai-settings-general
        [activeTab]="activeTab"
      ></app-ai-settings-general>

      <!-- Credit and Billing Panel -->
      <app-ai-settings-credit-and-billing
        [activeTab]="activeTab"
      ></app-ai-settings-credit-and-billing>

      <!-- Personalization Panel -->
      <app-ai-settings-personalization
        [activeTab]="activeTab"
      ></app-ai-settings-personalization>

      <!-- Memory Panel -->
      <app-ai-settings-memory
        [activeTab]="activeTab"
      ></app-ai-settings-memory>

      <!-- File & Media Panel -->
      <app-ai-settings-file-and-media
        [activeTab]="activeTab"
      ></app-ai-settings-file-and-media>

      <!-- Models Panel -->
      <app-ai-settings-models
        [activeTab]="activeTab"
      ></app-ai-settings-models>

      <!-- Connector Panel -->
      <app-ai-settings-connector
        [activeTab]="activeTab"
      ></app-ai-settings-connector>

      <!-- Data Control Panel -->
      <app-ai-settings-data-control
        [activeTab]="activeTab"
      ></app-ai-settings-data-control>
    </div>
  </div>
</div>
