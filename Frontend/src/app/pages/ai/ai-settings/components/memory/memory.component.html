@if (activeTab === 'memory') {
  <div class="mx-auto py-8.5 xl:max-w-[650px] animate-fade-in">
    <h2
      class="mb-6 border-b border-gray-200 pb-4 text-2xl font-semibold text-gray-900 dark:border-gray-800 dark:text-white/90"
    >
      Memory
    </h2>
    <div class="space-y-6">
      <!-- MEMORY -->
      <div class="space-y-4">
        <h3
          class="mb-2 text-xs font-medium text-gray-500 uppercase dark:text-gray-400"
        >
          Memory
        </h3>
        <div
          class="rounded-2xl border border-gray-100 bg-white dark:border-gray-800 dark:bg-white/3"
        >
          <!-- Enable memory -->
          <div
            class="flex items-center justify-between border-b border-gray-100 px-5 py-4 dark:border-gray-800"
          >
            <div>
              <p class="text-sm font-medium text-gray-800 dark:text-white/90">
                Enable memory
              </p>
              <p class="text-xs text-gray-500 dark:text-gray-400">
                Allow the assistant to recall past context
              </p>
            </div>
            <label class="flex cursor-pointer items-center select-none">
              <div class="relative">
                <input
                  type="checkbox"
                  class="sr-only"
                  [(ngModel)]="enableMemory"
                />
                <div
                  [class]="enableMemory ? 'bg-brand-500' : 'bg-gray-200 dark:bg-white/10'"
                  class="block h-5 w-9 rounded-full transition duration-200"
                ></div>
                <div
                  [class]="enableMemory ? 'translate-x-full' : 'translate-x-0'"
                  class="shadow-theme-sm absolute top-0.5 left-0.5 h-4 w-4 rounded-full bg-white transition duration-200 ease-linear"
                ></div>
              </div>
            </label>
          </div>

          <!-- Save conversations -->
          <div
            class="flex items-center justify-between px-5 py-4"
          >
            <div>
              <p class="text-sm font-medium text-gray-800 dark:text-white/90">
                Save conversations
              </p>
              <p class="text-xs text-gray-500 dark:text-gray-400">
                Keep chat history for future reference
              </p>
            </div>
            <label class="flex cursor-pointer items-center select-none">
              <div class="relative">
                <input
                  type="checkbox"
                  class="sr-only"
                  [(ngModel)]="saveConversations"
                />
                <div
                  [class]="saveConversations ? 'bg-brand-500' : 'bg-gray-200 dark:bg-white/10'"
                  class="block h-5 w-9 rounded-full transition duration-200"
                ></div>
                <div
                  [class]="saveConversations ? 'translate-x-full' : 'translate-x-0'"
                  class="shadow-theme-sm absolute top-0.5 left-0.5 h-4 w-4 rounded-full bg-white transition duration-200 ease-linear"
                ></div>
              </div>
            </label>
          </div>
        </div>
      </div>

      <!-- STORED CONTEXT -->
      <div class="space-y-4">
        <h3
          class="mb-2 text-xs font-medium text-gray-500 uppercase dark:text-gray-400"
        >
          Stored Context
        </h3>
        <div
          class="rounded-2xl border border-gray-100 bg-white px-5 py-4 dark:border-gray-800 dark:bg-white/3"
        >
          <!-- Import Chat Histories -->
          <p class="mb-3 text-sm font-medium text-gray-800 dark:text-white/90">
            Import Chat Histories
          </p>
          <div
            class="mb-5 grid grid-cols-2 gap-3 rounded-2xl border border-gray-200 bg-gray-100 p-1.5 sm:grid-cols-3 dark:border-gray-800 dark:bg-white/3"
          >
            <!-- Add Memory -->
            <button
              (click)="selectedTab = 'add-memory'"
              [class]="selectedTab === 'add-memory' ? 'border-brand-500' : 'border-transparent hover:bg-gray-50 dark:hover:bg-white/5'"
              class="flex flex-col items-start justify-start gap-2 rounded-xl border bg-white p-4 text-sm font-medium dark:bg-gray-900 cursor-pointer"
            >
              <svg
                [class]="selectedTab === 'add-memory' ? 'text-brand-500' : 'text-gray-500 dark:text-gray-400'"
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 20 20"
                fill="none"
              >
                <path
                  d="M12.5 12.0827H7.5M10 14.5827H7.5M9.58133 2.40283C9.74211 2.32983 9.91809 2.29102 10.0981 2.29102H14.375C15.0654 2.29102 15.625 2.85066 15.625 3.54102V16.4577C15.625 17.148 15.0654 17.7077 14.375 17.7077H5.625C4.93464 17.7077 4.375 17.148 4.375 16.4577V8.01689C4.375 7.83684 4.41384 7.6608 4.48689 7.49996C4.5483 7.36477 4.63386 7.24032 4.74084 7.13328L9.21391 2.65741C9.32113 2.55012 9.44583 2.46434 9.58133 2.40283ZM4.48689 7.49996H8.33407C9.02477 7.49996 9.58456 6.93977 9.58407 6.24907L9.58133 2.40283"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <span
                [class]="selectedTab === 'add-memory' ? 'text-brand-500' : 'text-gray-500 dark:text-gray-400'"
                >Add Memory</span
              >
            </button>

            <!-- Import Chats -->
            <button
              (click)="selectedTab = 'import-chats'"
              [class]="selectedTab === 'import-chats' ? 'border-brand-500' : 'border-transparent hover:bg-gray-50 dark:hover:bg-white/5'"
              class="flex flex-col items-start justify-start gap-2 rounded-xl border bg-white p-4 text-sm font-medium dark:bg-gray-900 cursor-pointer"
            >
              <svg
                [class]="selectedTab === 'import-chats' ? 'text-brand-500' : 'text-gray-500 dark:text-gray-400'"
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 20 20"
                fill="none"
              >
                <path
                  d="M9.99992 17.3724C14.027 17.3724 17.2916 14.1078 17.2916 10.0807C17.2916 6.05365 14.027 2.78906 9.99992 2.78906C5.97284 2.78906 2.70825 6.05365 2.70825 10.0807C2.70825 12.0943 3.5244 13.9172 4.84393 15.2367L2.70825 17.3724H9.99992Z"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M6.35425 10.0801H6.36258M10.0001 10.0801H10.0084M13.6459 10.0801H13.6542"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <span
                [class]="selectedTab === 'import-chats' ? 'text-brand-500' : 'text-gray-500 dark:text-gray-400'"
                >Import Chats</span
              >
            </button>

            <!-- Create Folder -->
            <button
              (click)="createFolder()"
              class="flex flex-col items-start justify-start gap-2 rounded-xl border border-transparent bg-white p-4 text-sm font-medium hover:bg-gray-50 dark:bg-gray-900 dark:hover:bg-white/5 cursor-pointer text-left"
            >
              <svg
                class="text-gray-500 dark:text-gray-400"
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 20 20"
                fill="none"
              >
                <path
                  d="M5 10.0002H15.0006M10.0002 5V15.0006"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <span class="text-gray-500 dark:text-gray-400">Create Folder</span>
            </button>
          </div>

          <!-- Clear Memory -->
          <div
            class="flex items-center justify-between gap-4 border-t border-gray-100 pt-4 dark:border-gray-800"
          >
            <div>
              <p class="text-sm font-medium text-gray-800 dark:text-white/90">
                Clear Memory
              </p>
              <p class="text-xs text-gray-500 dark:text-gray-400">
                Permanently delete all stored facts and preferences
              </p>
            </div>
            <button
              (click)="clearMemory()"
              class="inline-flex items-center gap-1.5 rounded-lg border border-red-400 px-4 py-2 text-sm font-medium text-red-500 hover:bg-red-50 dark:border-red-500/30 dark:hover:bg-red-500/10 cursor-pointer"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 20 20"
                fill="none"
              >
                <path
                  d="M4.37492 4.79102V16.4577C4.37492 17.148 4.93456 17.7077 5.62492 17.7077H14.3749C15.0653 17.7077 15.6249 17.148 15.6249 16.4577V4.79102M3.33325 4.79102H16.6658M4.37492 13.2456V8.24561M15.6249 13.2456V8.24561M8.33325 13.7493V8.74935M11.6666 13.7493V8.74935M12.7078 4.79102V3.54102C12.7078 2.85066 12.1482 2.29102 11.4578 2.29102H8.54118C7.85082 2.29102 7.29118 2.85066 7.29118 3.54102V4.79102H12.7078Z"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
}
