<!-- ===== Backdrop ===== -->
@if (isSidebarOpen) {
  <div
    (click)="closeSidebar()"
    class="fixed inset-0 z-40 bg-black/60 xl:hidden animate-fade-in"
  ></div>
}

<!-- ===== Close Button over Backdrop (below xl) ===== -->
@if (isSidebarOpen) {
  <div
    class="fixed top-4 right-72 z-[999999] xl:hidden"
  >
    <button
      (click)="closeSidebar()"
      class="flex size-9 items-center justify-center rounded-full bg-white text-gray-500 shadow-lg hover:bg-gray-50 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-gray-700"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="M18 6L6 18M6 6l12 12"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
    </button>
  </div>
}

<!-- ===== Right Drawer (below xl) ===== -->
<div
  [class]="isSidebarOpen ? 'translate-x-0' : 'translate-x-full'"
  class="fixed top-0 right-0 z-[99999] h-full w-72 overflow-y-auto bg-white p-3 shadow-xl transition-transform duration-300 ease-in-out xl:hidden dark:bg-gray-900"
>
  <ng-container *ngTemplateOutlet="tabMenuInner"></ng-container>
</div>

<!-- ===== Desktop Sidebar (xl+) ===== -->
<div
  class="hidden h-full overflow-y-auto border-gray-200 bg-white p-3 xl:block xl:w-62.5 xl:border-r dark:border-gray-800 dark:bg-gray-900"
>
  <ng-container *ngTemplateOutlet="tabMenuInner"></ng-container>
</div>

<!-- ===== Shared Tab Menu Template ===== -->
<ng-template #tabMenuInner>
  <div class="space-y-4">
    <!-- Workspace Dropdown -->
    <div
      class="relative"
      (clickOutside)="workspaceOpen = false"
      [clickOutsideActive]="workspaceOpen"
    >
      <button
        (click)="workspaceOpen = !workspaceOpen"
        class="flex w-full items-center justify-between rounded-lg border border-gray-100 p-3 hover:bg-gray-50 dark:border-gray-800 dark:hover:bg-white/5"
      >
        <div class="flex items-center gap-2.5">
          <div
            [class]="selectedWorkspace === 1 ? 'bg-brand-400' : 'bg-warning-400'"
            class="inline-flex size-9 shrink-0 items-center justify-center rounded-full text-sm font-medium text-white"
          >
            {{ selectedWorkspace === 1 ? 'M' : 'L' }}
          </div>
          <div class="text-left">
            <h4 class="text-sm font-medium text-gray-800 dark:text-white/90">
              {{ selectedWorkspace === 1 ? 'Musharof Chy' : 'Leonardo Dicaprio' }}
            </h4>
            <p class="text-xs text-gray-500 dark:text-gray-400">
              {{ selectedWorkspace === 1 ? 'Personal' : 'Business' }}
            </p>
          </div>
        </div>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 20 20"
          fill="none"
          class="shrink-0 text-gray-500 dark:text-gray-400"
        >
          <path
            d="M5.83337 7.50065L10 3.33398L14.1667 7.50065"
            stroke="currentColor"
            stroke-width="1.33333"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M5.83337 12.5L10 16.6667L14.1667 12.5"
            stroke="currentColor"
            stroke-width="1.33333"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>

      <!-- Dropdown Panel -->
      @if (workspaceOpen) {
        <div
          class="absolute top-full right-0 left-0 z-50 mt-1 rounded-xl border border-gray-200 bg-white p-1.5 shadow-lg dark:border-gray-700 dark:bg-gray-800 animate-fade-in"
        >
          <!-- Workspace Item 1 -->
          <button
            (click)="selectedWorkspace = 1; workspaceOpen = false"
            class="flex w-full items-center justify-between rounded-lg px-1.5 py-2 hover:bg-gray-50 dark:hover:bg-white/5"
          >
            <div class="flex items-center gap-2.5">
              <div
                class="bg-brand-400 inline-flex size-9 shrink-0 items-center justify-center rounded-full text-sm font-medium text-white"
              >
                M
              </div>
              <div class="text-left">
                <h4 class="text-sm font-medium text-gray-800 dark:text-white/90">
                  Musharof Chy
                </h4>
                <p class="text-xs text-gray-500 dark:text-gray-400">Personal</p>
              </div>
            </div>
            @if (selectedWorkspace === 1) {
              <svg
                class="text-gray-700 dark:text-gray-400"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
              >
                <path
                  d="M18.75 7.29297L9.33315 16.7098L5.25 12.6267"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            }
          </button>

          <!-- Workspace Item 2 -->
          <button
            (click)="selectedWorkspace = 2; workspaceOpen = false"
            class="flex w-full items-center justify-between rounded-lg px-1.5 py-2 hover:bg-gray-50 dark:hover:bg-white/5"
          >
            <div class="flex items-center gap-2.5">
              <div
                class="bg-warning-400 inline-flex size-9 shrink-0 items-center justify-center rounded-full text-sm font-medium text-white"
              >
                L
              </div>
              <div class="text-left">
                <h4 class="text-sm font-medium text-gray-800 dark:text-white/90">
                  Leonardo Dicaprio
                </h4>
                <p class="text-xs text-gray-500 dark:text-gray-400">Business</p>
              </div>
            </div>
            @if (selectedWorkspace === 2) {
              <svg
                class="text-gray-700 dark:text-gray-400"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
              >
                <path
                  d="M18.75 7.29297L9.33315 16.7098L5.25 12.6267"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            }
          </button>

          <!-- Divider -->
          <div class="my-1 border-t border-gray-100 dark:border-gray-700"></div>

          <!-- Create Workspace -->
          <button
            class="flex w-full items-center gap-2.5 rounded-lg px-1.5 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:text-gray-300 dark:hover:bg-white/5"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
            >
              <path
                d="M6 12.0002H18.0007M12.0002 6V18.0007"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Create WorkSpace
          </button>
        </div>
      }
