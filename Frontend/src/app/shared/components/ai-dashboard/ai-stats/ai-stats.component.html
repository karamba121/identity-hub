<div class="grid grid-cols-1 gap-6 sm:grid-cols-2 xl:grid-cols-4">
  @for (stat of stats; track stat.label) {
      <div class="flex flex-col rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03]">
        <div class="mb-4 flex items-center justify-between">
          <span class="text-sm font-medium text-gray-500 dark:text-gray-400">{{ stat.label }}</span>
          <div [class]="stat.accentClass">
            @switch (stat.icon) {
              @case ('users') {
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                  <path d="M14.109 5.10414C14.4743 4.94178 14.8789 4.85156 15.3045 4.85156C16.932 4.85156 18.2514 6.17095 18.2514 7.79851C18.2514 9.42606 16.932 10.7455 15.3045 10.7455C14.8794 10.7455 14.4753 10.6555 14.1103 10.4935M15.797 13.2207C19.5989 13.4453 20.821 16.009 21.2134 17.6906C21.3993 18.4875 20.7424 19.1487 19.9241 19.1487H17.59M11.7512 7.79855C11.7512 9.4261 10.4318 10.7455 8.80427 10.7455C7.17671 10.7455 5.85732 9.4261 5.85732 7.79855C5.85732 6.171 7.17671 4.8516 8.80427 4.8516C10.4318 4.8516 11.7512 6.171 11.7512 7.79855ZM8.74941 13.205C12.9833 13.205 14.3026 15.9309 14.7132 17.6906C14.8991 18.4875 14.2422 19.1487 13.4239 19.1487H4.07489C3.25661 19.1487 2.59973 18.4875 2.78565 17.6906C3.19623 15.9309 4.51554 13.205 8.74941 13.205Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              }
              @case ('projects') {
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                  <path d="M3.12012 16.5216V6.47999C3.12012 5.6847 3.76482 5.03999 4.56012 5.03999H8.64012C9.09337 5.03999 9.52017 5.25339 9.79212 5.61599L11.0881 7.34399C11.3601 7.70659 11.7869 7.91999 12.2401 7.91999H18.2401C19.0354 7.91999 19.6801 8.5647 19.6801 9.35999V11.5404M19.6801 11.5404C20.5438 11.6866 21.101 12.5919 20.7882 13.4521L18.9555 18.4921C18.7485 19.0612 18.2077 19.44 17.6022 19.44H4.56664C3.74345 19.44 3.12642 18.7623 3.12538 17.9999M19.6801 11.5404C19.6008 11.527 19.5189 11.52 19.4349 11.52H6.39936C5.79383 11.52 5.25299 11.8988 5.04606 12.4679L3.21332 17.5079C3.15361 17.6721 3.12561 17.8379 3.12538 17.9999M3.12538 17.9999V16.5216" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              }
              @case ('revenue') {
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                  <path d="M15.484 7.72311C15.484 6.2798 14.314 5.10976 12.8707 5.10976H11.8138C9.99228 5.10976 8.51562 6.58641 8.51562 8.40795C8.51562 9.78276 9.36841 11.0134 10.6557 11.4961L13.344 12.5043C14.6312 12.9871 15.484 14.2177 15.484 15.5925C15.484 17.414 14.0074 18.8907 12.1858 18.8907H11.129C9.68566 18.8907 8.51562 17.7206 8.51562 16.2773M11.9996 19.2829L11.9996 21.2083M11.9996 2.79175L11.9996 4.7171" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              }
              @default {
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                  <path d="M18.12 14.3777C18.12 13.6818 17.5558 13.1176 16.8599 13.1176H16.2C15.4047 13.1176 14.76 13.7624 14.76 14.5576V14.8121C14.76 15.4124 15.1323 15.9496 15.6944 16.1604L17.1856 16.7197C17.7477 16.9305 18.12 17.4678 18.12 18.0681V18.3225C18.12 19.1178 17.4753 19.7625 16.68 19.7625H16.0201C15.3242 19.7625 14.76 19.1984 14.76 18.5024M16.44 19.7625V20.88M16.44 12V13.1176M10.0055 19.92H6.17437C5.37908 19.92 4.73438 19.2753 4.73438 18.48V17.2214C4.73438 14.8355 6.66851 12.9014 9.05437 12.9014H10.0313M15.4498 6.5708C15.4498 8.47663 13.9047 10.0216 11.9989 10.0216C10.0932 10.0216 8.54813 8.47663 8.54813 6.5708C8.54813 4.66497 10.0932 3.12 11.9989 3.12C13.9047 3.12 15.4498 4.66497 15.4498 6.5708Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              }
            }
          </div>
        </div>
        <h2 class="mb-2 text-3xl font-semibold text-gray-800 dark:text-white/90">{{ stat.value }}</h2>
        <div class="flex items-center justify-between">
          <span class="text-sm text-gray-500 dark:text-gray-400">{{ stat.period }}</span>
          <span class="flex items-center text-sm font-medium" [ngClass]="stat.trend === 'up' ? 'text-success-600 dark:text-success-500' : 'text-error-600 dark:text-error-500'">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              @if (stat.trend === 'up') {
                <path d="M7.9974 2.66602L7.9974 13.3336M4 6.66334L7.99987 2.66602L12 6.66334" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
              } @else {
                <path d="M7.9974 13.3339L7.9974 2.66634M4 9.33652L7.99987 13.3338L12 9.33652" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
              }
            </svg>
            {{ stat.change }}
          </span>
        </div>
      </div>
    }
</div>
