<div class="rounded-2xl border border-gray-200 bg-white p-6 dark:border-gray-800 dark:bg-white/[0.03]">
    <div class="mb-8 flex flex-col gap-5 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">Users &amp; Revenue Statistics</h3>
        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Visualize month-to-month progress and engagement.</p>
      </div>
      <div class="inline-flex h-11 w-fit items-center gap-0.5 rounded-lg bg-gray-100 p-0.5 dark:bg-gray-900">
        <button type="button" class="h-10 rounded-md px-3 py-2.5 text-sm font-medium transition-colors hover:text-gray-900 dark:hover:bg-gray-800 dark:hover:text-white" [ngClass]="getRangeButtonClass('monthly')" (click)="setRange('monthly')">Monthly</button>
        <button type="button" class="h-10 rounded-md px-3 py-2.5 text-sm font-medium transition-colors hover:text-gray-900 dark:hover:bg-gray-800 dark:hover:text-white" [ngClass]="getRangeButtonClass('quarterly')" (click)="setRange('quarterly')">Quarterly</button>
        <button type="button" class="h-10 rounded-md px-3 py-2.5 text-sm font-medium transition-colors hover:text-gray-900 dark:hover:bg-gray-800 dark:hover:text-white" [ngClass]="getRangeButtonClass('annually')" (click)="setRange('annually')">Annually</button>
      </div>
    </div>
    <div class="custom-scrollbar max-w-full overflow-x-auto">
      <div class="-ml-4 min-w-[900px] pl-2 xl:min-w-full">
        <apx-chart
          [series]="series"
          [legend]="legend"
          [colors]="colors"
          [chart]="chart"
          [fill]="fill"
          [stroke]="stroke"
          [markers]="markers"
          [grid]="grid"
          [dataLabels]="dataLabels"
          [tooltip]="tooltip"
          [xaxis]="xaxis"
          [yaxis]="yaxis"
        ></apx-chart>
      </div>
    </div>
  </div>
