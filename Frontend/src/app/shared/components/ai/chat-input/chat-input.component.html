<div class="fixed bottom-5 left-1/2 z-20 w-full -translate-x-1/2 transform px-4 sm:px-6 lg:bottom-10 lg:px-8">
  <!-- Container with max width -->
  <div class="mx-auto w-full max-w-[720px] rounded-2xl border border-gray-200 bg-white p-3 shadow-xs dark:border-gray-700 dark:bg-white/5">
    <!-- Textarea -->
    <textarea
      [(ngModel)]="promptInput"
      (keydown.enter)="$event.preventDefault(); onSend()"
      [placeholder]="placeholder"
      class="h-20 w-full resize-none border-none bg-transparent px-2 font-normal text-gray-800 outline-none placeholder:text-sm placeholder:font-normal placeholder:text-gray-400 focus:ring-0 dark:text-white"
    ></textarea>

    <!-- Bottom Section -->
    <div class="flex items-center justify-between pt-2">
      <div class="flex items-center gap-1">
        @if (showUpload) {
          <label
            data-tooltip="Attachment"
            data-tooltip-placement="top"
            data-tooltip-variant="no-arrow"
            class="flex size-9 cursor-pointer items-center justify-center gap-1.5 rounded-lg border border-gray-200 text-sm text-gray-500 hover:text-gray-700 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-900 dark:hover:text-gray-300 bg-transparent"
          >
            <input type="file" class="sr-only" (change)="onFileChange($event)" />
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 20 20"
              fill="none"
            >
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M8.58191 1.54199C10.5624 1.54218 12.1688 3.14806 12.1688 5.12891V13.4541C12.1685 14.6513 11.1972 15.6221 9.99988 15.6221C8.80293 15.6217 7.83224 14.6511 7.83191 13.4541V5.12891C7.83191 4.71484 8.1679 4.37915 8.58191 4.37891C8.99612 4.37891 9.33191 4.71469 9.33191 5.12891V13.4541C9.33224 13.8226 9.63135 14.1217 9.99988 14.1221C10.3688 14.1221 10.6685 13.8229 10.6688 13.4541V12.0537C10.6679 12.0478 10.6679 12.0412 10.6678 12.0352L10.6688 5.12891C10.6688 3.97681 9.73429 3.04218 8.58191 3.04199C7.42969 3.04217 6.495 3.97664 6.495 5.12891V13.4541C6.49533 15.3893 8.06465 16.9587 9.99988 16.959C11.9353 16.959 13.5044 15.3895 13.5048 13.4541V7.96484C13.5049 7.55092 13.8409 7.21511 14.2548 7.21484C14.6689 7.21484 15.0046 7.55076 15.0048 7.96484V13.4541C15.0044 16.2179 12.7638 18.459 9.99988 18.459C7.23623 18.4587 4.99533 16.2177 4.995 13.4541V5.12891C4.995 3.14821 6.60126 1.54217 8.58191 1.54199Z"
                fill="currentColor"
              />
            </svg>
          </label>
        }

        <!-- Projected slot for left actions (e.g. aspect ratio buttons for image generator) -->
        <ng-content select="[leftActions]"></ng-content>
      </div>

      <div class="flex items-center gap-2">
        <!-- Projected slot for right actions -->
        <ng-content select="[rightActions]"></ng-content>

        <!-- Model Dropdown here -->
        @if (showModelDropdown) {
          <div class="relative" (clickOutside)="closeModelDropdown()">
            <button
              (click)="toggleModelDropdown()"
              class="flex h-9 items-center gap-1.5 rounded-lg bg-transparent px-2.5 py-2 text-sm text-gray-700 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-900 cursor-pointer"
            >
              <!-- Auto Select icon -->
              @if (selectedModel === 'Auto') {
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 18 18"
                  fill="none"
                >
                  <path
                    d="M9.61054 2.0625L3.58887 10.5264H8.38943L8.38943 15.9375L14.4111 7.47361L9.61054 7.47361V2.0625Z"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              }
              <!-- GPT icon -->
              @if (selectedModel === 'GPT 4.5' || selectedModel === 'GPT 5.5') {
                <img
                  src="./images/model/gpt-light.svg"
                  width="18"
                  height="18"
                  class="block dark:hidden"
                  alt="gpt"
                />
                <img
                  src="./images/model/gpt-dark.svg"
                  width="18"
                  height="18"
                  class="hidden dark:block"
                  alt="gpt"
                />
              }
              <!-- Claude icon -->
              @if (selectedModel === 'Claude Sonnet 4.5' || selectedModel === 'Claude Sonnet 4.6') {
                <img
                  src="./images/model/claude.svg"
                  width="18"
                  height="18"
                  alt="claude"
                />
              }
              <!-- Grok icon -->
              @if (selectedModel === 'Grok 3.0' || selectedModel === 'Grok 2.0') {
                <img
                  src="./images/model/grok-light.svg"
                  width="18"
                  height="18"
                  class="block dark:hidden"
                  alt="grok"
                />
                <img
                  src="./images/model/grok-dark.svg"
                  width="18"
                  height="18"
                  class="hidden dark:block"
                  alt="grok"
                />
              }
              <span>{{ selectedModel }}</span>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 18 18"
                fill="none"
                [class.rotate-180]="modelDropdownOpen"
                class="transition-transform duration-150"
              >
                <path
                  d="M4.3125 7.21875L9 11.9063L13.6875 7.21875"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>

            <!-- Dropdown Menu -->
            @if (modelDropdownOpen) {
              <ul
                class="absolute right-0 bottom-full mb-2 min-w-[220px] space-y-0.5 rounded-xl bg-white p-1.5 shadow-md dark:bg-gray-900 z-50"
              >
                <li>
                  <button
                    (click)="selectModel('Auto')"
                    [ngClass]="selectedModel === 'Auto' ? 'bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-white' : 'text-gray-700 dark:text-gray-400'"
                    class="flex w-full items-center gap-2 rounded-lg px-1.5 py-2 text-sm hover:bg-gray-100 hover:text-gray-900 dark:hover:bg-gray-800 dark:hover:text-white"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="18"
                      height="18"
                      viewBox="0 0 18 18"
                      fill="none"
                    >
                      <path
                        d="M9.61054 2.0625L3.58887 10.5264H8.38943L8.38943 15.9375L14.4111 7.47361L9.61054 7.47361V2.0625Z"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                    </svg>
                    Auto
                  </button>
                </li>
                <li>
                  <button
                    (click)="selectModel('GPT 4.5')"
                    [ngClass]="selectedModel === 'GPT 4.5' ? 'bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-white' : 'text-gray-700 dark:text-gray-400'"
                    class="flex w-full items-center gap-2 rounded-lg px-1.5 py-2 text-sm hover:bg-gray-100 hover:text-gray-900 dark:hover:bg-gray-800 dark:hover:text-white"
                  >
                    <img
                      src="./images/model/gpt-light.svg"
                      class="block dark:hidden"
                      alt="gpt light"
                    />
                    <img
                      src="./images/model/gpt-dark.svg"
                      class="hidden dark:block"
                      alt="gpt dark"
                    />
                    GPT 4.5
                    <span
                      class="bg-success-50 dark:bg-success-500/10 dark:text-success-500 text-success-600 inline-flex h-5 items-center justify-center rounded-full px-2 text-xs"
                      >New</span
                    >
                  </button>
                </li>
                <li>
                  <button
                    (click)="selectModel('GPT 5.5')"
                    [ngClass]="selectedModel === 'GPT 5.5' ? 'bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-white' : 'text-gray-700 dark:text-gray-400'"
                    class="flex w-full items-center gap-2 rounded-lg px-1.5 py-2 text-sm hover:bg-gray-100 hover:text-gray-900 dark:hover:bg-gray-800 dark:hover:text-white"
                  >
                    <img
                      src="./images/model/gpt-light.svg"
                      class="block dark:hidden"
                      alt="gpt light"
                    />
                    <img
                      src="./images/model/gpt-dark.svg"
                      class="hidden dark:block"
                      alt="gpt dark"
                    />
                    GPT 5.5
                  </button>
                </li>
                <li>
                  <button
                    (click)="selectModel('Claude Sonnet 4.5')"
                    [ngClass]="selectedModel === 'Claude Sonnet 4.5' ? 'bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-white' : 'text-gray-700 dark:text-gray-400'"
                    class="flex w-full items-center gap-2 rounded-lg px-1.5 py-2 text-sm hover:bg-gray-100 hover:text-gray-900 dark:hover:bg-gray-800 dark:hover:text-white"
                  >
                    <img src="./images/model/claude.svg" alt="claude light" />
                    Claude Sonnet 4.5
                  </button>
                </li>
                <li>
                  <button
                    (click)="selectModel('Claude Sonnet 4.6')"
                    [ngClass]="selectedModel === 'Claude Sonnet 4.6' ? 'bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-white' : 'text-gray-700 dark:text-gray-400'"
                    class="flex w-full items-center gap-2 rounded-lg px-1.5 py-2 text-sm hover:bg-gray-100 hover:text-gray-900 dark:hover:bg-gray-800 dark:hover:text-white"
                  >
                    <img src="./images/model/claude.svg" alt="claude light" />
                    Claude Sonnet 4.6
                  </button>
                </li>
                <li>
                  <button
                    (click)="selectModel('Grok 3.0')"
                    [ngClass]="selectedModel === 'Grok 3.0' ? 'bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-white' : 'text-gray-700 dark:text-gray-400'"
                    class="flex w-full items-center gap-2 rounded-lg px-1.5 py-2 text-sm hover:bg-gray-100 hover:text-gray-900 dark:hover:bg-gray-800 dark:hover:text-white"
                  >
                    <img
                      src="./images/model/grok-light.svg"
                      class="block dark:hidden"
                      alt="grok dark"
                    />
                    <img
                      src="./images/model/grok-dark.svg"
                      class="hidden dark:block"
                      alt="grok light"
                    />
                    Grok 3.0
                  </button>
                </li>
                <li>
                  <button
                    (click)="selectModel('Grok 2.0')"
                    [ngClass]="selectedModel === 'Grok 2.0' ? 'bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-white' : 'text-gray-700 dark:text-gray-400'"
                    class="flex w-full items-center gap-2 rounded-lg px-1.5 py-2 text-sm hover:bg-gray-100 hover:text-gray-900 dark:hover:bg-gray-800 dark:hover:text-white"
                  >
                    <img
                      src="./images/model/grok-light.svg"
                      class="block dark:hidden"
                      alt="grok dark"
                    />
                    <img
                      src="./images/model/grok-dark.svg"
                      class="hidden dark:block"
                      alt="grok light"
                    />
                    Grok 2.0
                  </button>
                </li>
              </ul>
            }
          </div>
        }

        <!-- Send Button -->
        <button
          (click)="onSend()"
          class="inline-flex h-9 w-9 items-center justify-center rounded-lg bg-gray-900 text-white transition hover:bg-gray-800 dark:bg-white/90 dark:text-gray-800 dark:hover:bg-gray-900 dark:hover:text-white/90 cursor-pointer"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 20 20"
            fill="none"
          >
            <path
              d="M9.99996 15.2082C6.7783 15.2082 4.16663 12.5965 4.16663 9.37484M9.99996 15.2082C13.2216 15.2082 15.8333 12.5965 15.8333 9.37484M9.99996 15.2082V17.7082M8.33329 17.7082H11.6666M9.99999 12.7082C8.15905 12.7082 6.66668 11.2158 6.66668 9.37486V5.62481C6.66668 3.78388 8.15905 2.2915 9.99999 2.2915C11.8409 2.2915 13.3333 3.78388 13.3333 5.62481V9.37486C13.3333 11.2158 11.8409 12.7082 9.99999 12.7082Z"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
