<div class="flex flex-col justify-center flex-1 w-full max-w-md mx-auto">
  <div class="mb-6">
    <p class="mb-2 text-sm font-medium text-brand-500">Identity Hub</p>
    <h1 class="mb-2 font-semibold text-gray-800 text-title-sm dark:text-white/90 sm:text-title-md">
      Recuperar sua senha
    </h1>
    <p class="text-sm text-gray-500 dark:text-gray-400">
      Informe o e-mail da conta. Se ela estiver apta, enviaremos um link de uso único.
    </p>
  </div>

  @if (errorMessage) {
    <div class="mb-5 rounded-lg border border-error-200 bg-error-50 px-4 py-3 text-sm text-error-700 dark:border-error-900 dark:bg-error-950/30 dark:text-error-300" role="alert">
      {{ errorMessage }}
    </div>
  }
  @if (successMessage) {
    <div class="mb-5 rounded-lg border border-success-200 bg-success-50 px-4 py-3 text-sm text-success-700 dark:border-success-900 dark:bg-success-950/30 dark:text-success-300" role="status">
      {{ successMessage }}
    </div>
  }

  <form (ngSubmit)="onSubmit()" class="space-y-5">
    <div>
      <app-label>E-mail <span class="text-error-500">*</span></app-label>
      <app-input-field
        type="email"
        name="email"
        placeholder="voce@exemplo.com"
        [(value)]="email"
        [disabled]="loading"
      />
    </div>
    <button
      type="submit"
      [disabled]="loading || !email"
      class="flex w-full items-center justify-center rounded-lg bg-brand-500 px-4 py-3 text-sm font-medium text-white transition hover:bg-brand-600 disabled:cursor-not-allowed disabled:opacity-50"
    >
      {{ loading ? 'Enviando…' : 'Enviar link de recuperação' }}
    </button>
  </form>

  <p class="mt-5 text-center text-sm text-gray-500 dark:text-gray-400">
    Lembrou sua senha?
    <a routerLink="/demo" class="font-medium text-brand-500 hover:text-brand-600 dark:text-brand-400">Iniciar novo acesso</a>
  </p>
</div>
