<div class="flex flex-col justify-center flex-1 w-full max-w-md mx-auto">
  <div>
    <div class="mb-6">
      <p class="mb-2 text-sm font-medium text-brand-500">Identity Hub</p>
      <h1 class="mb-2 font-semibold text-gray-800 text-title-sm dark:text-white/90 sm:text-title-md">
        Entrar na sua conta
      </h1>
      <p class="text-sm text-gray-500 dark:text-gray-400">
        @if (clientName) {
          Continue para <strong>{{ clientName }}</strong>.
        } @else {
          Confirme sua identidade para continuar.
        }
      </p>
    </div>

    @if (errorMessage) {
      <div class="mb-5 rounded-lg border border-error-200 bg-error-50 px-4 py-3 text-sm text-error-700 dark:border-error-900 dark:bg-error-950/30 dark:text-error-300" role="alert">
        {{ errorMessage }}
      </div>
    }

    <form (ngSubmit)="onSignIn()" class="space-y-6">
      <div>
        <app-label>E-mail <span class="text-error-500">*</span></app-label>
        <app-input-field
          type="email"
          placeholder="admin@identityhub.local"
          [(value)]="email"
          name="email"
          [disabled]="loading || !interactionId"
        />
      </div>

      <div>
        <app-label>Senha <span class="text-error-500">*</span></app-label>
        <div class="relative">
          <app-input-field
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Digite sua senha"
            [(value)]="password"
            name="password"
            [disabled]="loading || !interactionId"
          />
          <button
            type="button"
            (click)="togglePasswordVisibility()"
            class="absolute z-30 -translate-y-1/2 right-4 top-1/2 text-sm text-gray-500"
          >
            {{ showPassword ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
      </div>

      <button
        type="submit"
        [disabled]="loading || !interactionId || !email || !password"
        class="inline-flex w-full items-center justify-center rounded-lg bg-brand-500 px-4 py-3 text-sm font-medium text-white transition hover:bg-brand-600 disabled:cursor-not-allowed disabled:opacity-50"
      >
        {{ loading ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>

    <p class="mt-5 text-center text-xs text-gray-500 dark:text-gray-400">
      Sua senha é enviada somente ao Identity Hub e nunca é armazenada no navegador.
    </p>
  </div>
</div>
