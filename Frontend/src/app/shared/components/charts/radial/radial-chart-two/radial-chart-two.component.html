<div
  class="h-full flex flex-col rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03]"
>
  <div class="px-6 py-5">
    <h3 class="text-base font-medium text-gray-800 dark:text-white/90">
      Semi Radial Bar Chart
    </h3>
  </div>
  <div class="flex-1 border-t border-gray-100 p-6 dark:border-gray-800">
    <!-- ====== Radial Chart FortyOne Start -->
    <div class="relative flex justify-center">
      <div id="chartFortyOne" class="w-full">
        <apx-chart
          [series]="series"
          [chart]="chart"
          [colors]="colors"
          [plotOptions]="plotOptions"
          [stroke]="stroke"
          [legend]="legend"
          [tooltip]="tooltip"
        ></apx-chart>
      </div>
      <!-- <p
        class="absolute bottom-10.5 text-base font-medium text-gray-700 dark:text-white/90"
      >
        Salary
      </p> -->
    </div>
    <!-- ====== Radial Chart FortyOne End -->
  </div>
</div>
