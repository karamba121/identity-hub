<aside [class.translate-x-0]="isMobileOpen$ | async"
  [class.-translate-x-full]="!(isMobileOpen$ | async)"
  [style.width]="(isExpanded$ | async) ? '290px' : '0'"
  [style.overflow]="(isExpanded$ | async) ? '' : 'hidden'"
  [style.border-right-width]="(isExpanded$ | async) ? '1px' : '0'"
  [style.min-width]="(isExpanded$ | async) ? '290px' : '0'"
  class="sidebar fixed top-0 left-0 z-9999 flex h-screen flex-col border-r border-gray-200 bg-gray-50 transition-all duration-300 xl:static xl:translate-x-0 dark:border-gray-800 dark:bg-gray-900"
  [clickOutsideActive]="!!(isMobileOpen$ | async)"
  (clickOutside)="closeMobileMenu()">

  <!-- SIDEBAR HEADER -->
  <div class="px-5 pt-5 pb-7">
    <div class="relative flex items-center justify-between gap-2.5" [clickOutsideActive]="versionOpen" (clickOutside)="versionOpen = false">
      <div class="flex items-center gap-3">
        <a routerLink="/" class="shrink-0">
          <img src="/images/logo/logo-icon.svg" alt="Logo" class="h-8 w-8" />
        </a>
        <div>
          <span class="text-sm font-normal text-gray-800 dark:text-white/90">
            TailAdmin Docs
          </span>
          <span class="flex items-center gap-1 rounded text-xs font-medium text-gray-500 dark:text-gray-400">
            V2.0.0
          </span>
        </div>
      </div>
      <div class="ml-auto">
        <button (click)="toggleVersion()"
          class="inline-flex size-5 items-center justify-center rounded-md border border-gray-200 text-gray-800 dark:border-gray-800 dark:text-gray-400">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12.1668 6.24235L8.00016 2.07568L3.8335 6.24235M3.8335 9.75736L8.00016 13.924L12.1668 9.75736"
              stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>

      <!-- Version Dropdown -->
      @if (versionOpen) {
      <div class="absolute top-full right-0 left-0 z-50 mt-2 overflow-hidden rounded-lg bg-white p-1.5 shadow-lg dark:border-gray-700 dark:bg-gray-800">
        @for (version of versions; track version) {
          <button (click)="setVersion(version)"
            class="mb-0.5 flex w-full items-center justify-between rounded-lg px-3 py-2 text-sm text-gray-800 dark:text-white/90"
            [class.bg-gray-100]="activeVersion === version"
            [class.dark:bg-gray-700]="activeVersion === version"
            [class.dark:hover:bg-gray-700]="activeVersion !== version"
            [class.hover:bg-gray-100]="activeVersion !== version">
            <span>{{ version }}</span>
            @if (activeVersion === version) {
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                class="text-gray-700 dark:text-gray-300">
                <polyline points="20 6 9 17 4 12" />
              </svg>
            }
          </button>
        }
      </div>
      }
    </div>
  </div>
  <!-- SIDEBAR HEADER -->

  <!-- NAV -->
  <div class="no-scrollbar flex flex-col overflow-y-auto pb-10">
    <nav>
      @for (group of menuGroups; track group.id) {
        <div>
          <button (click)="toggleSection(group.id)"
            class="flex w-full items-center justify-between px-5 py-3 text-sm font-normal text-gray-700 dark:text-gray-300">
            {{ group.title }}
            <svg [class.rotate-180]="isSectionOpen(group.id)" class="text-gray-400 transition-transform duration-200"
              width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M3.83325 6.41675L7.99992 10.5834L12.1666 6.41675" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          @if (isSectionOpen(group.id)) {
            <div class="ml-5 border-l border-gray-200 dark:border-gray-700">
              <ul class="flex flex-col gap-3">
                @for (item of group.items; track item.label) {
                  <li>
                    <a href="javascript:void(0)"
                      class="docs-border-item"
                      [ngClass]="isActive(item.route?.split('/')?.pop() || '') ? 'docs-border-item-active' : 'docs-border-item-inactive'">
                      {{ item.label }}
                    </a>
                  </li>
                }
              </ul>
            </div>
          }
        </div>
      }
    </nav>
  </div>
  <!-- NAV -->
</aside>
