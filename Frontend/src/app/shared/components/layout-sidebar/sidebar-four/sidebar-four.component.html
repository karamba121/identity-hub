<aside [class.translate-x-0]="isMobileOpen$ | async"
  [class.-translate-x-full]="!(isMobileOpen$ | async)"
  [style.width]="(isExpanded$ | async) ? '290px' : '0'"
  [style.overflow]="(isExpanded$ | async) ? '' : 'hidden'"
  [style.border-right-width]="(isExpanded$ | async) ? '1px' : '0'"
  [style.min-width]="(isExpanded$ | async) ? '290px' : '0'"
  class="sidebar fixed top-16 left-0 z-9999 flex h-screen flex-col border-r border-gray-200 bg-gray-50 transition-all duration-300 xl:static xl:translate-x-0 dark:border-gray-800 dark:bg-gray-900"
  [clickOutsideActive]="!!(isMobileOpen$ | async)"
  (clickOutside)="closeMobileMenu()">

  <!-- SIDEBAR HEADER -->
  <div class="px-5 pt-5 pb-7">
    <div class="relative flex items-center justify-between gap-2.5" [clickOutsideActive]="versionOpen" (clickOutside)="versionOpen = false">
      <div class="flex items-center gap-3">
        <a routerLink="/" class="shrink-0">
          <img src="/images/logo/logo-icon.svg" alt="Logo" class="h-8 w-8" />
        </a>
        <div>
          <span class="text-sm font-normal text-gray-800 dark:text-white/90">
            TailAdmin Docs
          </span>
          <span class="flex items-center gap-1 rounded text-xs font-normal text-gray-500 dark:text-gray-400">
            {{ activeVersion }}
          </span>
        </div>
      </div>
      <div class="ml-auto">
        <button (click)="toggleVersion()"
          class="inline-flex size-5 items-center justify-center rounded-md border border-gray-200 text-gray-800 dark:border-gray-800 dark:text-gray-400">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12.1668 6.24235L8.00016 2.07568L3.8335 6.24235M3.8335 9.75736L8.00016 13.924L12.1668 9.75736"
              stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>

      <!-- Version Dropdown -->
      @if (versionOpen) {
      <div class="absolute top-full right-0 left-0 z-50 mt-2 overflow-hidden rounded-lg bg-white p-1.5 shadow-lg dark:border-gray-700 dark:bg-gray-800">
        @for (version of versions; track version) {
          <button (click)="setVersion(version)"
            class="flex w-full items-center justify-between rounded-lg px-3 py-2 text-sm font-normal text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-700"
            [class.bg-gray-100]="activeVersion === version"
            [class.dark:bg-gray-700]="activeVersion === version">
            <span>{{ version }}</span>
            @if (activeVersion === version) {
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                class="text-gray-700 dark:text-gray-300">
                <polyline points="20 6 9 17 4 12" />
              </svg>
            }
          </button>
        }
      </div>
      }
    </div>
  </div>
  <!-- SIDEBAR HEADER -->

  <!-- SEARCH -->
  <div class="px-5 pb-5">
    <div class="relative">
      <span class="pointer-events-none absolute top-1/2 left-3 -translate-y-1/2 text-gray-400">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12.944 12.945L15.9366 15.9376M14.8125 8.43695C14.8125 11.9569 11.9583 14.8104 8.4375 14.8104C4.91669 14.8104 2.0625 11.9569 2.0625 8.43695C2.0625 4.91698 4.91669 2.06348 8.4375 2.06348C11.9583 2.06348 14.8125 4.91698 14.8125 8.43695Z"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>
      <input type="text" placeholder="Search the docs"
        class="dark:bg-dark-900 shadow-theme-xs focus:border-brand-300 focus:ring-brand-500/10 dark:focus:border-brand-800 h-9 w-full rounded-lg border border-gray-200 bg-transparent py-2.5 pr-3 pl-9 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:outline-hidden dark:border-gray-800 dark:bg-white/[0.03] dark:text-white/90 dark:placeholder:text-white/30" />
    </div>
  </div>
  <!-- SEARCH -->

  <!-- NAV -->
  <div class="no-scrollbar flex flex-col overflow-y-auto px-5 pb-10">
    <nav class="space-y-1">
      @for (group of menuGroups; track group.id) {
        <div>
          <button (click)="toggleSection(group.id)"
            [class.bg-gray-100]="openSection === group.id"
            [class.dark:bg-gray-800]="openSection === group.id"
            [class.hover:bg-gray-100]="openSection !== group.id"
            [class.dark:hover:bg-gray-800]="openSection !== group.id"
            class="flex w-full items-center justify-between rounded-lg px-3 py-1.5 text-sm font-normal text-gray-800 dark:text-white/90">
            {{ group.title }}
            <svg [class.rotate-180]="openSection === group.id" class="transition-transform duration-200"
              width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3.83325 6.41675L7.99992 10.5834L12.1666 6.41675" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          @if (openSection === group.id) {
            <div>
              <ul class="flex flex-col gap-3 px-5 py-2">
                @for (item of group.items; track item.label) {
                  <li>
                    <a href="javascript:void(0)"
                      class="text-sm transition-colors duration-150"
                      [class.text-brand-500]="isActive(item.route?.split('/')?.pop() || '')"
                      [class.dark:text-brand-400]="isActive(item.route?.split('/')?.pop() || '')"
                      [class.text-gray-500]="!isActive(item.route?.split('/')?.pop() || '')"
                      [class.hover:text-brand-500]="!isActive(item.route?.split('/')?.pop() || '')"
                      [class.dark:text-gray-400]="!isActive(item.route?.split('/')?.pop() || '')">
                      {{ item.label }}
                    </a>
                  </li>
                }
              </ul>
            </div>
          }
        </div>
      }
    </nav>
  </div>
  <!-- NAV -->
</aside>
