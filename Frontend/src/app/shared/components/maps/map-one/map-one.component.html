<div
  class="rounded-2xl border border-gray-200 bg-white p-5 sm:p-6 dark:border-gray-800 dark:bg-white/[0.03]"
>
  <div class="mb-5 flex items-start justify-between">
    <div>
      <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">
        Map View
      </h3>
      <p class="text-theme-sm mt-1 text-gray-500 dark:text-gray-400">
        Clear view of locations at a glance
      </p>
    </div>
  </div>

  <div
    class="relative z-0 overflow-hidden rounded-2xl border border-gray-200 dark:border-gray-800"
  >
    <!-- Visually hidden description for screen readers -->
    <p id="mapLocationView3Desc" class="sr-only">
      Interactive map showing the Washington D.C. metro area. Use arrow keys to
      pan and plus/minus keys to zoom.
    </p>
    <div
      #mapContainer
      class="h-[300px] w-full"
      role="application"
      aria-label="Interactive location map"
      aria-describedby="mapLocationView3Desc"
      tabindex="0"
    ></div>

    <!-- Zoom Controls -->
    <div class="absolute top-3 right-3 z-[999]">
      <div
        class="flex flex-col overflow-hidden rounded-lg border border-gray-200 bg-white dark:border-gray-800 dark:bg-gray-900"
      >
        <button
          (click)="zoomIn()"
          type="button"
          class="flex h-9 w-9 items-center justify-center border-b border-gray-200 text-gray-500 hover:bg-gray-100 hover:text-gray-700 dark:border-gray-800 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-white"
          aria-label="Zoom in"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 16 16"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M8 3.33334V12.6667M3.33334 8H12.6667"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <button
          (click)="zoomOut()"
          type="button"
          class="flex h-9 w-9 items-center justify-center text-gray-500 hover:bg-gray-100 hover:text-gray-700 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-white"
          aria-label="Zoom out"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 16 16"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M3.33334 8H12.6667"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
