<div class="rounded-2xl border border-gray-200 bg-white p-6 dark:border-gray-800 dark:bg-white/3">
  <div class="mb-8 flex flex-col gap-5 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h3 class="text-lg font-medium text-gray-800 dark:text-white/90">
        Users & Revenue Statistics
      </h3>
      <p class="text-theme-sm mt-1 text-gray-500 dark:text-gray-400">
        Visualize month-to-month progress and engagement.
      </p>
    </div>

    <div class="inline-flex h-11 w-fit items-center gap-0.5 rounded-lg bg-gray-100 p-0.5 dark:bg-gray-900">
      @for (tab of tabs; track tab) {
        <button
          (click)="selected = $any(tab)"
          [class]="selected === tab
            ? 'shadow-theme-xs text-gray-900 dark:text-white bg-white dark:bg-gray-800 text-theme-sm h-10 rounded-md px-3 py-2.5 font-medium transition-colors'
            : 'text-gray-500 dark:text-gray-400 text-theme-sm h-10 rounded-md px-3 py-2.5 font-medium transition-colors hover:text-gray-900 dark:hover:bg-gray-800 dark:hover:text-white'"
        >
          {{ tab }}
        </button>
      }
    </div>
  </div>

  <div class="custom-scrollbar max-w-full overflow-x-auto">
    <div class="-ml-4 min-w-[1000px] pl-2 xl:min-w-full">
      <apx-chart
        [series]="chartOptions.series"
        [chart]="chartOptions.chart"
        [legend]="chartOptions.legend"
        [colors]="chartOptions.colors"
        [fill]="chartOptions.fill"
        [stroke]="chartOptions.stroke"
        [markers]="chartOptions.markers"
        [grid]="chartOptions.grid"
        [dataLabels]="chartOptions.dataLabels"
        [tooltip]="chartOptions.tooltip"
        [xaxis]="chartOptions.xaxis"
        [yaxis]="chartOptions.yaxis"
      />
    </div>
  </div>
</div>
