<div class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03]">
  <div class="mb-4 flex items-center justify-between gap-2">
    <div>
      <h3 class="text-lg font-medium text-gray-800 dark:text-white/90">
        Sales by Channel
      </h3>
      <p class="text-sm text-gray-500 dark:text-gray-400">
        Channel performance overview
      </p>
    </div>

    <div class="relative">
      <button
        (click)="toggleDropdown('sale-by-channel')"
        [class]="openDropdown === 'sale-by-channel' ? 'text-gray-700 dark:text-white' : 'text-gray-400 hover:text-gray-700 dark:hover:text-white'"
      >
        <svg
          class="fill-current"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            fill-rule="evenodd"
            clip-rule="evenodd"
            d="M10.2441 6C10.2441 5.0335 11.0276 4.25 11.9941 4.25H12.0041C12.9706 4.25 13.7541 5.0335 13.7541 6C13.7541 6.9665 12.9706 7.75 12.0041 7.75H11.9941C11.0276 7.75 10.2441 6.9665 10.2441 6ZM10.2441 18C10.2441 17.0335 11.0276 16.25 11.9941 16.25H12.0041C12.9706 16.25 13.7541 17.0335 13.7541 18C13.7541 18.9665 12.9706 19.75 12.0041 19.75H11.9941C11.0276 19.75 10.2441 18.9665 10.2441 18ZM11.9941 10.25C11.0276 10.25 10.2441 11.0335 10.2441 12C10.2441 12.9665 11.0276 13.75 11.9941 13.75H12.0041C12.9706 13.75 13.7541 12.9665 13.7541 12C13.7541 11.0335 12.9706 10.25 12.0041 10.25H11.9941Z"
            fill=""
          />
        </svg>
      </button>
      <app-dropdown [isOpen]="openDropdown === 'sale-by-channel'" (close)="closeDropdown()" className="w-40 p-2">
        <app-dropdown-item (itemClick)="closeDropdown()" className="flex w-full rounded-lg text-left font-normal text-gray-500 hover:bg-gray-100 hover:text-gray-700 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-gray-300">View More</app-dropdown-item>
        <app-dropdown-item (itemClick)="closeDropdown()" className="flex w-full rounded-lg text-left font-normal text-gray-500 hover:bg-gray-100 hover:text-gray-700 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-gray-300">Delete</app-dropdown-item>
      </app-dropdown>
    </div>
  </div>
  <div class="mb-6 flex items-center gap-2">
    <h3 class="text-3xl text-gray-800 dark:text-white/90">75</h3>
    <span class="text-success-600 flex items-center text-sm">
      <svg
        width="16"
        height="16"
        viewBox="0 0 16 16"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M7.9974 2.66602L7.9974 13.3336M4 6.66334L7.99987 2.66602L12 6.66334"
          stroke="#039855"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      3.2%
    </span>
    <span class="text-sm text-gray-500 dark:text-gray-400"
      >Increased vs last week</span
    >
  </div>
  
  <div class="chartThirty">
    <apx-chart
      [series]="chartOptions.series!"
      [chart]="chartOptions.chart!"
      [plotOptions]="chartOptions.plotOptions!"
      [colors]="chartOptions.colors!"
      [dataLabels]="chartOptions.dataLabels!"
      [xaxis]="chartOptions.xaxis!"
      [yaxis]="chartOptions.yaxis!"
      [grid]="chartOptions.grid!"
      [tooltip]="chartOptions.tooltip!"
      [legend]="chartOptions.legend!"
    ></apx-chart>
  </div>

  <div class="mt-5 rounded-xl border border-gray-200 dark:border-gray-800">
    <div
      class="flex gap-6 border-b border-gray-200 px-4 py-3 dark:border-gray-800"
    >
      <div class="flex items-center gap-1.5">
        <span class="bg-brand-500 inline-block size-2 rounded-full"></span>
        <span class="text-sm text-gray-700 dark:text-gray-400"> Website</span>
      </div>
      <div class="flex items-center gap-1.5">
        <span class="bg-blue-light-400 inline-block size-2 rounded-full"></span>
        <span class="text-sm text-gray-700 dark:text-gray-400"> Email</span>
      </div>
      <div class="flex items-center gap-1.5">
        <span class="inline-block size-2 rounded-full bg-gray-200"></span>
        <span class="text-sm text-gray-700 dark:text-gray-400">
          Social Media</span
        >
      </div>
    </div>
    <div class="p-4">
      <table class="w-full">
        <thead>
          <th class="pb-2 text-left text-sm font-normal text-gray-400">
            Channels
          </th>
          <th class="pb-2 text-left text-sm font-normal text-gray-400">
            Metric
          </th>
          <th class="pb-2 text-right text-sm font-normal text-gray-400">
            Total
          </th>
        </thead>
        <tbody>
          <tr>
            <td class="py-2 text-sm text-gray-700 dark:text-gray-400">
              Website
            </td>
            <td class="py-2 text-sm text-gray-700 dark:text-gray-400">35</td>
            <td
              class="py-2 text-right text-sm text-gray-700 dark:text-gray-400"
            >
              <span class="flex items-center justify-end gap-1.5">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 16 16"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M7.9974 2.66602L7.9974 13.3336M4 6.66334L7.99987 2.66602L12 6.66334"
                    stroke="#039855"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                5.2%
              </span>
            </td>
          </tr>
          <tr>
            <td class="py-2 text-sm text-gray-700 dark:text-gray-400">Email</td>
            <td class="py-2 text-sm text-gray-700 dark:text-gray-400">25</td>
            <td
              class="py-2 text-right text-sm text-gray-700 dark:text-gray-400"
            >
              <span
                class="text-error-600 flex items-center justify-end gap-1.5"
              >
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 16 16"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M7.9974 13.3336L7.9974 2.66602M4 9.33619L7.99987 13.3335L12 9.33619"
                    stroke="#D92D20"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>

                5.2%
              </span>
            </td>
          </tr>
          <tr>
            <td class="py-2 text-sm text-gray-700 dark:text-gray-400">
              Social Media
            </td>
            <td class="py-2 text-sm text-gray-700 dark:text-gray-400">59</td>
            <td
              class="py-2 text-right text-sm text-gray-700 dark:text-gray-400"
            >
              <span
                class="text-success-600 flex items-center justify-end gap-1.5"
              >
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 16 16"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M7.9974 2.66602L7.9974 13.3336M4 6.66334L7.99987 2.66602L12 6.66334"
                    stroke="#039855"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                5.2%
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
