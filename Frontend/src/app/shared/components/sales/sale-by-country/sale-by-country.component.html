<div
  class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03]"
>
  <div class="mb-7 flex items-center justify-between gap-2">
    <div>
      <h3 class="text-lg font-medium text-gray-800 dark:text-white/90">
        Sales by Country
      </h3>
      <p class="text-sm text-gray-500 dark:text-gray-400">
        Country-wise sales overview
      </p>
    </div>
    <div class="relative inline-block">
      <button class="dropdown-toggle" (click)="toggleDropdown()">
        <svg
          class="fill-current text-gray-400 hover:text-gray-700 dark:hover:text-white size-6"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            fill-rule="evenodd"
            clip-rule="evenodd"
            d="M10.2441 6C10.2441 5.0335 11.0276 4.25 11.9941 4.25H12.0041C12.9706 4.25 13.7541 5.0335 13.7541 6C13.7541 6.9665 12.9706 7.75 12.0041 7.75H11.9941C11.0276 7.75 10.2441 6.9665 10.2441 6ZM10.2441 18C10.2441 17.0335 11.0276 16.25 11.9941 16.25H12.0041C12.9706 16.25 13.7541 17.0335 13.7541 18C13.7541 18.9665 12.9706 19.75 12.0041 19.75H11.9941C11.0276 19.75 10.2441 18.9665 10.2441 18ZM11.9941 10.25C11.0276 10.25 10.2441 11.0335 10.2441 12C10.2441 12.9665 11.0276 13.75 11.9941 13.75H12.0041C12.9706 13.75 13.7541 12.9665 13.7541 12C13.7541 11.0335 12.9706 10.25 12.0041 10.25H11.9941Z"
            fill="currentColor"
          />
        </svg>
      </button>

      <app-dropdown [isOpen]="isOpen" (close)="closeDropdown()" className="w-40 p-2">
        <app-dropdown-item (itemClick)="closeDropdown()"
          className="flex w-full font-normal text-left text-gray-500 rounded-lg hover:bg-gray-100 hover:text-gray-700 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-gray-300">
          View More
        </app-dropdown-item>
        <app-dropdown-item (itemClick)="closeDropdown()"
          className="flex w-full font-normal text-left text-gray-500 rounded-lg hover:bg-gray-100 hover:text-gray-700 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-gray-300">
          Delete
        </app-dropdown-item>
      </app-dropdown>
    </div>
  </div>
  <div
    id="mapTwo"
    class="mapTwo -mt-6! h-[180px]! w-full! bg-transparent! p-3"
  >
    <app-country-map mapType="sales"></app-country-map>
  </div>
  <ul class="space-y-4 pt-3">
    @for (country of countries; track $index) {
    <li class="grid grid-cols-4 justify-between gap-4">
      <div class="col-span-2">
        <div class="flex items-center gap-2.5">
          <img
            [src]="country.img"
            class="size-4 rounded-full"
            [alt]="country.alt"
          />
          <span class="text-sm text-gray-800 dark:text-white/90">{{ country.name }}</span>
        </div>
      </div>
      <div class="col-span-1">
        <span class="text-sm text-gray-700 dark:text-gray-400">{{ country.sales }}</span>
      </div>
      <div class="col-span-1 text-right">
        <span class="text-sm text-gray-700 dark:text-gray-400">{{ country.percent }}</span>
      </div>
    </li>
    }
  </ul>
</div>
