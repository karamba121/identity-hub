<div
  class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/3"
>
  <div class="flex items-center justify-between px-6 py-4">
    <div>
      <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">
        Top Products
      </h3>
    </div>
    <div class="flex gap-3">
       <button
        class="text-theme-sm shadow-theme-xs inline-flex h-10 items-center gap-2 rounded-lg border border-gray-300 bg-white px-4 py-2.5 font-medium text-gray-700 hover:bg-gray-50 hover:text-gray-800 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-white/[0.03] dark:hover:text-gray-200"
      >
        <svg
          class="fill-white stroke-current dark:fill-gray-800"
          width="20"
          height="20"
          viewBox="0 0 20 20"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M2.29004 5.90393H17.7067"
            stroke=""
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M17.7075 14.0961H2.29085"
            stroke=""
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M12.0826 3.33331C13.5024 3.33331 14.6534 4.48431 14.6534 5.90414C14.6534 7.32398 13.5024 8.47498 12.0826 8.47498C10.6627 8.47498 9.51172 7.32398 9.51172 5.90415C9.51172 4.48432 10.6627 3.33331 12.0826 3.33331Z"
            fill=""
            stroke=""
            stroke-width="1.5"
          />
          <path
            d="M7.91745 11.525C6.49762 11.525 5.34662 12.676 5.34662 14.0959C5.34661 15.5157 6.49762 16.6667 7.91745 16.6667C9.33728 16.6667 10.4883 15.5157 10.4883 14.0959C10.4883 12.676 9.33728 11.525 7.91745 11.525Z"
            fill=""
            stroke=""
            stroke-width="1.5"
          />
        </svg>
        Filter
      </button>
      <button
        class="text-theme-sm shadow-theme-xs inline-flex h-10 items-center gap-2 rounded-lg border border-gray-300 bg-white px-4 py-2.5 font-medium text-gray-700 hover:bg-gray-50 hover:text-gray-800 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-white/[0.03] dark:hover:text-gray-200"
      >
        See All
      </button>
    </div>
  </div>
  <div class="px-5 pb-5">
    <div
      class="custom-scrollbar max-w-full overflow-x-auto rounded-xl border border-gray-100 dark:border-gray-800"
    >
      <table class="min-w-full">
        <!-- table header start -->
        <thead class="border-b border-gray-100 dark:border-gray-800">
          <tr>
            <th class="px-5 py-3 whitespace-nowrap">
              <div class="flex items-center">
                <p
                  class="text-theme-xs font-medium text-gray-500 dark:text-gray-400"
                >
                  Product Name
                </p>
              </div>
            </th>
            <th class="px-5 py-3 whitespace-nowrap">
              <div class="flex items-center">
                <p
                  class="text-theme-xs font-medium text-gray-500 dark:text-gray-400"
                >
                  Product ID
                </p>
              </div>
            </th>
            <th class="px-5 py-3 whitespace-nowrap">
              <div class="flex items-center">
                <p
                  class="text-theme-xs font-medium text-gray-500 dark:text-gray-400"
                >
                  Sales
                </p>
              </div>
            </th>
            <th class="px-5 py-3 whitespace-nowrap">
              <div class="flex items-center">
                <p
                  class="text-theme-xs font-medium text-gray-500 dark:text-gray-400"
                >
                  Earnings
                </p>
              </div>
            </th>
            <th class="px-5 py-3 whitespace-nowrap">
              <div class="flex items-center">
                <p
                  class="text-theme-xs font-medium text-gray-500 dark:text-gray-400"
                >
                  Stocks
                </p>
              </div>
            </th>
            <th class="px-5 py-3 whitespace-nowrap">
              <div class="flex items-center">
                <p
                  class="text-theme-xs font-medium text-gray-500 dark:text-gray-400"
                >
                  Status
                </p>
              </div>
            </th>
          </tr>
        </thead>
        <!-- table header end -->

        <!-- table body start -->
        <tbody class="divide-y divide-gray-100 py-3 dark:divide-gray-800">
          @for (product of products; track $index) {
          <tr>
            <td class="px-5 py-2 whitespace-nowrap">
              <div class="flex items-center">
                <div class="flex items-center gap-3">
                  <div class="size-12.5 overflow-hidden rounded-md">
                    <img
                      [src]="product.img"
                      alt="Product"
                    />
                  </div>
                  <div>
                    <p
                      class="text-theme-sm font-medium text-gray-800 dark:text-white/90"
                    >
                      {{ product.name }}
                    </p>
                    <span
                      class="text-theme-xs text-gray-500 dark:text-gray-400"
                    >
                      {{ product.meta }}
                    </span>
                  </div>
                </div>
              </div>
            </td>
            <td class="px-5 py-2 whitespace-nowrap">
              <div class="flex items-center">
                <p class="text-theme-sm text-gray-500 dark:text-gray-400">
                  {{ product.category }}
                </p>
              </div>
            </td>
            <td class="px-5 py-2 whitespace-nowrap">
              <div class="flex items-center">
                <p class="text-theme-sm text-gray-500 dark:text-gray-400">
                  {{ product.sales }}
                </p>
              </div>
            </td>
            <td class="px-5 py-2 whitespace-nowrap">
              <div class="flex items-center">
                <p class="text-theme-sm text-gray-500 dark:text-gray-400">
                  {{ product.earnings }}
                </p>
              </div>
            </td>
            <td class="px-5 py-2 whitespace-nowrap">
              <div class="flex items-center">
                <p class="text-theme-sm text-gray-500 dark:text-gray-400">{{ product.stocks }}</p>
              </div>
            </td>
            <td class="px-5 py-2 whitespace-nowrap">
              <div class="flex items-center">
                <p
                  class="text-theme-xs rounded-full px-2 py-0.5 font-medium"
                  [ngClass]="{
                    'bg-success-50 text-success-600 dark:bg-success-500/15 dark:text-success-500': product.status === 'In Stock',
                    'bg-error-50 text-error-600 dark:bg-error-500/15 dark:text-error-500': product.status === 'Low Stock'
                  }"
                >
                  {{ product.status }}
                </p>
              </div>
            </td>
          </tr>
          }
        </tbody>

        <!-- table body end -->
      </table>
    </div>
  </div>
</div>
