<div class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03]">
  <!-- Header -->
  <div class="mb-4 flex items-center justify-between gap-2">
    <div>
      <h2 class="text-lg font-medium text-gray-800 dark:text-white/90">User Retention</h2>
      <p class="text-sm text-gray-500 dark:text-gray-400">User engagement over time</p>
    </div>

    <div class="relative">
      <button [class]="openDropdown ? 'text-gray-700 dark:text-white' : 'text-gray-400 hover:text-gray-700 dark:hover:text-white'" (click)="toggleDropdown('retention-menu')">
        <svg class="fill-current" width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M10.2441 6C10.2441 5.0335 11.0276 4.25 11.9941 4.25H12.0041C12.9706 4.25 13.7541 5.0335 13.7541 6C13.7541 6.9665 12.9706 7.75 12.0041 7.75H11.9941C11.0276 7.75 10.2441 6.9665 10.2441 6ZM10.2441 18C10.2441 17.0335 11.0276 16.25 11.9941 16.25H12.0041C12.9706 16.25 13.7541 17.0335 13.7541 18C13.7541 18.9665 12.9706 19.75 12.0041 19.75H11.9941C11.0276 19.75 10.2441 18.9665 10.2441 18ZM11.9941 10.25C11.0276 10.25 10.2441 11.0335 10.2441 12C10.2441 12.9665 11.0276 13.75 11.9941 13.75H12.0041C12.9706 13.75 13.7541 12.9665 13.7541 12C13.7541 11.0335 12.9706 10.25 12.0041 10.25H11.9941Z" fill="" />
        </svg>
      </button>
      <app-dropdown [isOpen]="openDropdown === 'retention-menu'" (close)="closeDropdown()" className="w-40 p-2">
        <app-dropdown-item (itemClick)="closeDropdown()" className="flex w-full rounded-lg text-left font-normal text-gray-500 hover:bg-gray-100 hover:text-gray-700 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-gray-300">View More</app-dropdown-item>
        <app-dropdown-item (itemClick)="closeDropdown()" className="flex w-full rounded-lg text-left font-normal text-gray-500 hover:bg-gray-100 hover:text-gray-700 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-gray-300">Delete</app-dropdown-item>
      </app-dropdown>
    </div>
  </div>

  <!-- Stat row -->
  <div class="mb-6 flex items-center gap-2">
    <h3 class="text-3xl font-medium text-gray-800 dark:text-white/90">24%</h3>
    <span class="text-success-600 flex items-center text-sm font-medium">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M7.9974 2.66602L7.9974 13.3336M4 6.66334L7.99987 2.66602L12 6.66334" stroke="#039855" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      3.2%
    </span>
    <span class="text-sm text-gray-500 dark:text-gray-400">Increased vs last week</span>
  </div>

  <!-- Heatmap -->
  <div #wrapperRef class="relative w-full" (mouseleave)="handleMouseLeave()">
    <!-- Tooltip -->
    @if (tooltip) {
    <div
      class="pointer-events-none absolute z-10 -translate-x-1/2 -translate-y-full rounded-md border border-gray-200 bg-white px-2 py-1 text-xs text-gray-700 shadow-md dark:border-gray-700 dark:bg-gray-900 dark:text-gray-200"
      [style.left.px]="tooltip.x"
      [style.top.px]="tooltip.y - 6"
    >
      <span class="font-medium">{{ tooltip.col + 1 }}</span>: {{ tooltip.value }}%
    </div>
    }

    <!-- Table -->
    <table class="w-full" style="table-layout: fixed; border-collapse: separate; border-spacing: 3px">
      <tbody>
        @for (row of matrix; track $index) {
        <tr>
          @for (value of row; track $index) {
          <td style="padding: 0">
            <div
              class="w-full transition-opacity duration-150"
              [ngClass]="value > 0 ? 'hover:opacity-75 cursor-pointer' : 'cursor-default'"
              [style.height.px]="17"
              [style.backgroundColor]="getCellColor(value)"
              style="border-radius: 1px;"
              (mouseenter)="handleMouseEnter($event, value, $index)"
            ></div>
          </td>
          }
        </tr>
        }
      </tbody>
      <!-- X-axis labels -->
      <tfoot>
        <tr>
          @for (label of colLabels; track label) {
          <td class="text-center text-xs text-gray-400" style="padding: 8px 0 0 0">
            {{ label }}
          </td>
          }
        </tr>
      </tfoot>
    </table>
  </div>
</div>
