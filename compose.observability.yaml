services:
  backend:
    environment:
      IDENTITY_HUB_METRICS_TOKEN: ""
      IDENTITY_HUB_METRICS_TOKEN_LOCATION: file:/run/secrets/identity-hub-metrics-token
    secrets:
      - identity_hub_metrics_token

  prometheus:
    image: prom/prometheus:v3.13.2
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${IDENTITY_HUB_PROMETHEUS_RETENTION:-15d}
    ports:
      - "${IDENTITY_HUB_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./ops/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - identity_hub_prometheus_data:/prometheus
    secrets:
      - identity_hub_metrics_token
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - identity_hub

  grafana:
    image: grafana/grafana:13.1.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${IDENTITY_HUB_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${IDENTITY_HUB_GRAFANA_ADMIN_PASSWORD:?Defina IDENTITY_HUB_GRAFANA_ADMIN_PASSWORD no arquivo .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${IDENTITY_HUB_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - identity_hub_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - identity_hub

secrets:
  identity_hub_metrics_token:
    file: ${IDENTITY_HUB_METRICS_TOKEN_FILE:?Defina IDENTITY_HUB_METRICS_TOKEN_FILE no arquivo .env}

volumes:
  identity_hub_prometheus_data:
  identity_hub_grafana_data:
