services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${IDENTITY_HUB_DB_NAME:-identity_hub}
      POSTGRES_USER: ${IDENTITY_HUB_DB_USERNAME:-identity_hub}
      POSTGRES_PASSWORD: ${IDENTITY_HUB_DB_PASSWORD:?Defina IDENTITY_HUB_DB_PASSWORD no arquivo .env}
    ports:
      - "${IDENTITY_HUB_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - identity_hub_postgres_data:/var/lib/postgresql/data
    networks:
      - identity_hub

  backend:
    build:
      context: ./Backend
    image: identity-hub-backend:${IDENTITY_HUB_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${IDENTITY_HUB_SPRING_PROFILE:-default}
      IDENTITY_HUB_DB_URL: jdbc:postgresql://postgres:5432/${IDENTITY_HUB_DB_NAME:-identity_hub}
      IDENTITY_HUB_DB_USERNAME: ${IDENTITY_HUB_DB_USERNAME:-identity_hub}
      IDENTITY_HUB_DB_PASSWORD: ${IDENTITY_HUB_DB_PASSWORD:?Defina IDENTITY_HUB_DB_PASSWORD no arquivo .env}
      IDENTITY_HUB_ISSUER: ${IDENTITY_HUB_PUBLIC_URL:-http://localhost:4200}
      IDENTITY_HUB_SIGNING_KEY_SOURCE: ${IDENTITY_HUB_SIGNING_KEY_SOURCE:-generated}
      IDENTITY_HUB_SIGNING_KEY_ID: ${IDENTITY_HUB_SIGNING_KEY_ID:-}
      IDENTITY_HUB_SIGNING_PRIVATE_KEY_LOCATION: ${IDENTITY_HUB_SIGNING_PRIVATE_KEY_LOCATION:-}
      IDENTITY_HUB_SIGNING_PUBLIC_KEY_LOCATION: ${IDENTITY_HUB_SIGNING_PUBLIC_KEY_LOCATION:-}
      IDENTITY_HUB_SIGNING_NEXT_KEY_ID: ${IDENTITY_HUB_SIGNING_NEXT_KEY_ID:-}
      IDENTITY_HUB_SIGNING_NEXT_PRIVATE_KEY_LOCATION: ${IDENTITY_HUB_SIGNING_NEXT_PRIVATE_KEY_LOCATION:-}
      IDENTITY_HUB_SIGNING_NEXT_PUBLIC_KEY_LOCATION: ${IDENTITY_HUB_SIGNING_NEXT_PUBLIC_KEY_LOCATION:-}
      IDENTITY_HUB_SIGNING_ACTIVATION_AT: ${IDENTITY_HUB_SIGNING_ACTIVATION_AT:-}
      IDENTITY_HUB_SIGNING_PREVIOUS_KEY_RETENTION: ${IDENTITY_HUB_SIGNING_PREVIOUS_KEY_RETENTION:-10m}
      IDENTITY_HUB_UI_BASE_URL: ${IDENTITY_HUB_PUBLIC_URL:-http://localhost:4200}
      IDENTITY_HUB_DEMO_REDIRECT_URI: ${IDENTITY_HUB_PUBLIC_URL:-http://localhost:4200}/demo/callback
      IDENTITY_HUB_DEMO_POST_LOGOUT_REDIRECT_URI: ${IDENTITY_HUB_PUBLIC_URL:-http://localhost:4200}/demo/logout
      IDENTITY_HUB_COOKIE_SECURE: ${IDENTITY_HUB_COOKIE_SECURE:-false}
      IDENTITY_HUB_WEBAUTHN_RP_ID: ${IDENTITY_HUB_WEBAUTHN_RP_ID:-localhost}
      IDENTITY_HUB_WEBAUTHN_RP_NAME: ${IDENTITY_HUB_WEBAUTHN_RP_NAME:-Identity Hub}
      IDENTITY_HUB_WEBAUTHN_ALLOWED_ORIGINS: ${IDENTITY_HUB_WEBAUTHN_ALLOWED_ORIGINS:-http://localhost:4200}
      IDENTITY_HUB_FEDERATION_ENABLED: ${IDENTITY_HUB_FEDERATION_ENABLED:-false}
      IDENTITY_HUB_FEDERATION_REGISTRATION_ID: ${IDENTITY_HUB_FEDERATION_REGISTRATION_ID:-corporate}
      IDENTITY_HUB_FEDERATION_DISPLAY_NAME: ${IDENTITY_HUB_FEDERATION_DISPLAY_NAME:-Provedor corporativo}
      IDENTITY_HUB_FEDERATION_CLIENT_ID: ${IDENTITY_HUB_FEDERATION_CLIENT_ID:-}
      IDENTITY_HUB_FEDERATION_CLIENT_SECRET: ${IDENTITY_HUB_FEDERATION_CLIENT_SECRET:-}
      IDENTITY_HUB_FEDERATION_ISSUER_URI: ${IDENTITY_HUB_FEDERATION_ISSUER_URI:-}
      IDENTITY_HUB_FEDERATION_AUTHORIZATION_URI: ${IDENTITY_HUB_FEDERATION_AUTHORIZATION_URI:-}
      IDENTITY_HUB_FEDERATION_TOKEN_URI: ${IDENTITY_HUB_FEDERATION_TOKEN_URI:-}
      IDENTITY_HUB_FEDERATION_JWK_SET_URI: ${IDENTITY_HUB_FEDERATION_JWK_SET_URI:-}
      IDENTITY_HUB_FEDERATION_USER_INFO_URI: ${IDENTITY_HUB_FEDERATION_USER_INFO_URI:-}
      IDENTITY_HUB_FEDERATION_SCOPES: ${IDENTITY_HUB_FEDERATION_SCOPES:-openid,profile,email}
      IDENTITY_HUB_MAIL_HOST: ${IDENTITY_HUB_MAIL_HOST:-host.docker.internal}
      IDENTITY_HUB_MAIL_PORT: ${IDENTITY_HUB_MAIL_PORT:-1025}
      IDENTITY_HUB_MAIL_FROM: ${IDENTITY_HUB_MAIL_FROM:-no-reply@identityhub.local}
      IDENTITY_HUB_MAIL_AUTH: ${IDENTITY_HUB_MAIL_AUTH:-false}
      IDENTITY_HUB_MAIL_STARTTLS: ${IDENTITY_HUB_MAIL_STARTTLS:-false}
      IDENTITY_HUB_MAIL_USERNAME: ${IDENTITY_HUB_MAIL_USERNAME:-}
      IDENTITY_HUB_MAIL_PASSWORD: ${IDENTITY_HUB_MAIL_PASSWORD:-}
      IDENTITY_HUB_EMAIL_VERIFICATION_TTL: ${IDENTITY_HUB_EMAIL_VERIFICATION_TTL:-30m}
      IDENTITY_HUB_PASSWORD_RECOVERY_TTL: ${IDENTITY_HUB_PASSWORD_RECOVERY_TTL:-15m}
      IDENTITY_HUB_LOGIN_FAILURE_THRESHOLD: ${IDENTITY_HUB_LOGIN_FAILURE_THRESHOLD:-5}
      IDENTITY_HUB_LOGIN_INITIAL_LOCK_DURATION: ${IDENTITY_HUB_LOGIN_INITIAL_LOCK_DURATION:-1m}
      IDENTITY_HUB_LOGIN_MAXIMUM_LOCK_DURATION: ${IDENTITY_HUB_LOGIN_MAXIMUM_LOCK_DURATION:-15m}
      IDENTITY_HUB_RATE_LIMIT_WINDOW: ${IDENTITY_HUB_RATE_LIMIT_WINDOW:-1m}
      IDENTITY_HUB_RATE_LIMIT_SUBJECT: ${IDENTITY_HUB_RATE_LIMIT_SUBJECT:-10}
      IDENTITY_HUB_RATE_LIMIT_ORIGIN: ${IDENTITY_HUB_RATE_LIMIT_ORIGIN:-60}
      IDENTITY_HUB_RATE_LIMIT_COMBINATION: ${IDENTITY_HUB_RATE_LIMIT_COMBINATION:-8}
      IDENTITY_HUB_RATE_LIMIT_MAXIMUM_BUCKETS: ${IDENTITY_HUB_RATE_LIMIT_MAXIMUM_BUCKETS:-100000}
      IDENTITY_HUB_ADAPTIVE_AUTHENTICATION_ENABLED: ${IDENTITY_HUB_ADAPTIVE_AUTHENTICATION_ENABLED:-true}
      IDENTITY_HUB_ADAPTIVE_FAILED_ATTEMPT_THRESHOLD: ${IDENTITY_HUB_ADAPTIVE_FAILED_ATTEMPT_THRESHOLD:-3}
      IDENTITY_HUB_ADAPTIVE_SIGNAL_WINDOW: ${IDENTITY_HUB_ADAPTIVE_SIGNAL_WINDOW:-15m}
      IDENTITY_HUB_ADAPTIVE_CHALLENGE_TTL: ${IDENTITY_HUB_ADAPTIVE_CHALLENGE_TTL:-5m}
      IDENTITY_HUB_ADAPTIVE_SENSITIVE_SCOPES: ${IDENTITY_HUB_ADAPTIVE_SENSITIVE_SCOPES:-}
      IDENTITY_HUB_AUDIT_RETENTION_ENABLED: ${IDENTITY_HUB_AUDIT_RETENTION_ENABLED:-false}
      IDENTITY_HUB_AUDIT_RETENTION_PERIOD: ${IDENTITY_HUB_AUDIT_RETENTION_PERIOD:-365d}
      IDENTITY_HUB_AUDIT_RETENTION_BATCH_SIZE: ${IDENTITY_HUB_AUDIT_RETENTION_BATCH_SIZE:-1000}
      IDENTITY_HUB_AUDIT_RETENTION_INITIAL_DELAY: ${IDENTITY_HUB_AUDIT_RETENTION_INITIAL_DELAY:-1m}
      IDENTITY_HUB_AUDIT_RETENTION_INTERVAL: ${IDENTITY_HUB_AUDIT_RETENTION_INTERVAL:-1h}
      IDENTITY_HUB_MFA_ENCRYPTION_KEY: ${IDENTITY_HUB_MFA_ENCRYPTION_KEY:?Defina IDENTITY_HUB_MFA_ENCRYPTION_KEY no arquivo .env}
      IDENTITY_HUB_BOOTSTRAP_ENABLED: ${IDENTITY_HUB_BOOTSTRAP_ENABLED:-true}
      IDENTITY_HUB_DEMO_EMAIL: ${IDENTITY_HUB_DEMO_EMAIL:-admin@identityhub.local}
      IDENTITY_HUB_DEMO_PASSWORD: ${IDENTITY_HUB_DEMO_PASSWORD:?Defina IDENTITY_HUB_DEMO_PASSWORD no arquivo .env}
      IDENTITY_HUB_DEMO_NAME: ${IDENTITY_HUB_DEMO_NAME:-Administrador Identity Hub}
      IDENTITY_HUB_DEMO_CLIENT_ID: ${IDENTITY_HUB_DEMO_CLIENT_ID:-identity-hub-demo}
      IDENTITY_HUB_DEMO_CLIENT_NAME: ${IDENTITY_HUB_DEMO_CLIENT_NAME:-Cliente demonstrativo Identity Hub}
      IDENTITY_HUB_DEMO_TENANT_SLUG: ${IDENTITY_HUB_DEMO_TENANT_SLUG:-identity-hub-demo}
      IDENTITY_HUB_DEMO_TENANT_NAME: ${IDENTITY_HUB_DEMO_TENANT_NAME:-Organização demonstrativa}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${IDENTITY_HUB_BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - identity_hub

  frontend:
    build:
      context: ./Frontend
    image: identity-hub-frontend:${IDENTITY_HUB_IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "${IDENTITY_HUB_HTTP_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - identity_hub

  resource-server-example:
    build:
      context: ./examples/resource-server
    image: identity-hub-resource-server-example:${IDENTITY_HUB_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      RESOURCE_SERVER_PORT: 8081
      IDENTITY_HUB_ISSUER: ${IDENTITY_HUB_PUBLIC_URL:-http://localhost:4200}
      IDENTITY_HUB_JWK_SET_URI: http://backend:8080/oauth2/jwks
      IDENTITY_HUB_RESOURCE_AUDIENCE: identity-hub-api
      IDENTITY_HUB_RESOURCE_SCOPE: demo.read
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${IDENTITY_HUB_RESOURCE_SERVER_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - identity_hub

volumes:
  identity_hub_postgres_data:

networks:
  identity_hub:
    driver: bridge
