global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: identity-hub
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /run/secrets/identity-hub-metrics-token
    dns_sd_configs:
      - names:
          - backend
        type: A
        port: 8080
        refresh_interval: 15s
